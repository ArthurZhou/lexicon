<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lexicon">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Lexicon 词典 · 背单词</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --brand: #2563eb; --brand-ink: #ffffff; --line: #e2e8f0;
    --again: #dc2626; --hard: #f59e0b; --good: #16a34a; --easy: #0891b2;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overscroll-behavior-y: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    background: linear-gradient(135deg, #1d4ed8, #2563eb, #3b82f6);
    color: #fff; padding: calc(12px + var(--safe-t)) 16px 22px 16px;
  }
  header .toprow { display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; }
  header .mini { font-size: .72rem; opacity: .85; }
  header .progress { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  header .pill {
    background: rgba(255,255,255,.16); border-radius: 10px; padding: 8px 12px;
    font-size: .82rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  header .pill b { font-size: 1.05rem; }
  header select {
    background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 10px; font-size: .82rem; font-weight: 600; max-width: 130px;
  }
  header select option { color: #0f172a; }
  main { flex: 1; overflow-y: auto; padding: 0 14px calc(86px + var(--safe-b)); }
  .page { display: none; }
  .page.on { display: block; }
  .cardbox {
    background: var(--card); border-radius: 18px; margin: 12px auto; max-width: 640px;
    box-shadow: 0 1px 3px rgba(15,23,42,.08), 0 10px 30px rgba(15,23,42,.08);
    border: 1px solid var(--line); overflow: hidden;
  }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .04em; }
  .tag.word { background: #dbeafe; color: #1d4ed8; }
  .tag.phrase { background: #dcfce7; color: #15803d; }
  .tag.pattern { background: #fef3c7; color: #b45309; }
  .tag.tier-easy { background: #e0f2fe; color: #0369a1; }
  .tag.tier-medium { background: #fef9c3; color: #a16207; }
  .tag.tier-hard { background: #fee2e2; color: #b91c1c; }
  .cardhead { display: flex; gap: 6px; align-items: center; padding: 14px 20px 0; }
  .prompt {
    padding: 16px 20px 14px; font-size: 1.28rem; font-weight: 700; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap; min-height: 84px;
  }
  .prompt .blank {
    display: inline-block; min-width: 64px; border-bottom: 2px solid var(--brand);
    color: transparent; user-select: none;
  }
  .hint { padding: 0 20px 8px; color: var(--muted); font-size: .95rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
  .answer-box { padding: 10px 20px 6px; display: none; }
  .answer-box.show { display: block; }
  .answer-box .aw {
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px;
    padding: 14px 16px; font-size: 1.4rem; font-weight: 800; color: #14532d;
    word-break: break-word; text-align: center;
  }
  .answer-box .phon { color: #15803d; font-size: 1rem; font-weight: 600; }
  .answer-box .meta { margin-top: 10px; font-size: .9rem; color: #334155; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .button-row { padding: 12px 20px 18px; display: flex; gap: 10px; }
  button {
    border: 0; border-radius: 12px; font-weight: 700; cursor: pointer;
    touch-action: manipulation; font-size: .98rem; color: #fff; font-family: inherit;
  }
  .btn { flex: 1; padding: 15px 8px; font-size: 1rem; font-weight: 800; }
  .btn.again { background: var(--again); }
  .btn.hard { background: var(--hard); }
  .btn.good { background: var(--good); }
  .btn.easy { background: var(--easy); }
  .reveal {
    width: 100%; display: block; margin: 0; padding: 16px;
    background: var(--brand); color: var(--brand-ink); font-size: 1.05rem; border-radius: 0;
  }
  .ghost {
    background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe;
    padding: 9px 14px; border-radius: 10px; font-size: .86rem; font-weight: 700; cursor: pointer;
  }
  .ghost.warn { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .section-title { font-size: .8rem; font-weight: 800; color: var(--muted); letter-spacing: .1em; margin: 18px 6px 8px; }
  .row-item {
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    margin-bottom: 8px;
  }
  .row-item .hw { font-weight: 700; font-size: 1.02rem; word-break: break-word; }
  .row-item .sub { color: var(--muted); font-size: .82rem; margin-top: 4px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .row-item .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .row-item.click { cursor: pointer; }
  .searchbox { display: flex; gap: 8px; padding: 12px 0; }
  .searchbox input {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-size: 1rem; background: #fff; font-family: inherit;
  }
  .searchbox button { background: var(--brand); color: #fff; border-radius: 12px; padding: 0 18px; }
  .setting-row {
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .setting-row .lbl { flex: 1; font-weight: 600; font-size: .92rem; }
  .setting-row input[type=number] {
    width: 76px; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: .95rem;
  }
  .stat-line { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stat-cell { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat-cell .n { font-size: 1.2rem; font-weight: 800; }
  .stat-cell .t { font-size: .72rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: .95rem; }
  .empty .big { font-size: 2.2rem; margin-bottom: 10px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding-bottom: var(--safe-b);
  }
  nav button {
    background: none; color: var(--muted); padding: 10px 4px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: .68rem; font-weight: 700;
  }
  nav button .ico { font-size: 1.3rem; }
  nav button.on { color: var(--brand); }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: .95; }
  .dialog-bg {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40;
    align-items: flex-end; justify-content: center;
  }
  .dialog-bg.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 18px 18px 0 0; width: 100%; max-width: 640px;
    padding: 18px 16px calc(18px + var(--safe-b)); max-height: 72vh; overflow-y: auto;
  }
  .dialog h3 { margin: 0 0 12px; font-size: 1.05rem; }
  .dialog .close { float: right; background: none; color: var(--muted); font-size: 1.2rem; }
  .def-text { font-size: .92rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #1e293b; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="toprow">
      <h1>Lexicon</h1>
      <select id="listSel"><option value="0">全部词库</option></select>
    </div>
    <div class="progress">
      <div class="pill">🆕 新学 <b id="pNew">0</b><span class="mini" id="pNewLim">/20</span></div>
      <div class="pill">🔁 复习 <b id="pRev">0</b><span class="mini" id="pRevLim">/100</span></div>
    </div>
  </header>
  <main>
    <!-- ===== 复习 ===== -->
    <section class="page on" id="page-review">
      <div class="cardbox" id="cardBox" style="display:none">
        <div class="cardhead">
          <span class="tag" id="cardType">word</span>
          <span class="tag" id="cardTier">easy</span>
          <span class="mini" style="margin-left:auto;color:var(--muted);font-size:.72rem" id="cardSource"></span>
        </div>
        <div class="prompt" id="cardPrompt"></div>
        <div class="hint" id="cardHint"></div>
        <div class="answer-box" id="answerBox">
          <div class="aw"><span id="answerWord"></span> <span class="phon" id="answerPhon"></span></div>
          <div class="meta" id="answerMeta"></div>
        </div>
        <button class="reveal" id="btnReveal">显示答案</button>
        <div class="button-row" id="gradeRow" style="display:none">
          <button class="btn again" data-g="0">忘了</button>
          <button class="btn hard" data-g="1">困难</button>
          <button class="btn good" data-g="2">认识</button>
          <button class="btn easy" data-g="3">简单</button>
        </div>
      </div>
      <div class="empty" id="reviewEmpty">
        <div class="big">🎉</div>
        今日任务已完成<br><small>去「查词」添加生词，或到「词组」学固定搭配</small>
      </div>
    </section>

    <!-- ===== 词组 ===== -->
    <section class="page" id="page-phrases">
      <div class="searchbox">
        <input id="phraseSearch" placeholder="输入单词，查它的词组/固定搭配…">
        <button id="phraseGo">查词组</button>
      </div>
      <div id="phraseResults"></div>
      <div class="section-title">词组库</div>
      <div id="bankList"></div>
      <button class="ghost" id="bankMore" style="width:100%">加载更多</button>
    </section>

    <!-- ===== 查词 ===== -->
    <section class="page" id="page-lookup">
      <div class="searchbox">
        <input id="searchInput" placeholder="输入单词前缀搜索…">
        <button id="searchGo">搜索</button>
      </div>
      <div id="searchResults"></div>
      <button class="ghost" id="btnRandom" style="width:100%">🎲 随机抽一个生词</button>
    </section>

    <!-- ===== 更多 ===== -->
    <section class="page" id="page-more">
      <div class="stat-line" id="statCells"></div>
      <div class="section-title">每日上限</div>
      <div class="setting-row">
        <span class="lbl">新学卡片 / 天</span>
        <input type="number" id="setNew" min="0" max="500">
      </div>
      <div class="setting-row">
        <span class="lbl">复习卡片 / 天</span>
        <input type="number" id="setRev" min="0" max="2000">
      </div>
      <button class="ghost" id="setSave" style="width:100%;margin-bottom:14px">保存设置</button>
      <div class="section-title">维护</div>
      <button class="ghost" id="btnRebuild" style="width:100%;margin-bottom:14px">重建词组库（从词典提取全部词组）</button>
      <div class="section-title">学习记录</div>
      <div id="recordList"></div>
    </section>
  </main>

  <nav>
    <button class="on" data-page="review"><span class="ico">📖</span>复习</button>
    <button data-page="phrases"><span class="ico">🧩</span>词组</button>
    <button data-page="lookup"><span class="ico">🔍</span>查词</button>
    <button data-page="more"><span class="ico">⚙️</span>更多</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="dialog-bg" id="dialogBg">
    <div class="dialog">
      <button class="close" id="dialogClose">✕</button>
      <h3 id="dialogTitle"></h3>
      <div class="def-text" id="dialogBody"></div>
    </div>
  </div>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var state = { card: null, list: 0, bankOffset: 0 };

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 1800);
}

function api(path, opts) {
  return fetch(path, opts).then(function (r) { return r.json(); });
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---- navigation ---- */
document.querySelectorAll("nav button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("nav button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("on"); });
    $("page-" + b.dataset.page).classList.add("on");
    if (b.dataset.page === "more") loadMore();
    if (b.dataset.page === "phrases" && !state.bankLoaded) loadBank(0);
  });
});

/* ---- header: settings + wordlist selector ---- */
function loadHeader() {
  api("/api/settings").then(function (s) {
    $("pNew").textContent = s.new_done;
    $("pNewLim").textContent = "/" + s.new_per_day;
    $("pRev").textContent = s.review_done;
    $("pRevLim").textContent = "/" + s.review_per_day;
    $("setNew").value = s.new_per_day;
    $("setRev").value = s.review_per_day;
    state.list = s.active_wordlist || 0;
  });
  api("/api/wordlists").then(function (lists) {
    var sel = $("listSel");
    sel.innerHTML = '<option value="0">全部词库</option>';
    lists.forEach(function (w) {
      var o = document.createElement("option");
      o.value = w.id; o.textContent = w.name + " (" + w.size + ")";
      sel.appendChild(o);
    });
    sel.value = String(state.list);
  });
}
$("listSel").addEventListener("change", function () {
  state.list = parseInt(this.value, 10) || 0;
  api("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ active_wordlist: this.value })
  }).then(function () { nextCard(); });
});
$("setSave").addEventListener("click", function () {
  api("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ new_per_day: +$("setNew").value, review_per_day: +$("setRev").value })
  }).then(function () { toast("已保存"); loadHeader(); });
});

/* ---- review ---- */
function tierName(d) { return d === "hard" ? "困难" : d === "medium" ? "中等" : "简单"; }
function typeName(k) { return k === "phrase" ? "词组" : k === "pattern" ? "句型" : "单词"; }

function nextCard() {
  api("/api/due?limit=1&list=" + state.list).then(function (r) {
    if (!r.cards || !r.cards.length) {
      state.card = null;
      $("cardBox").style.display = "none";
      $("reviewEmpty").style.display = "block";
      loadHeader();
      return;
    }
    state.card = r.cards[0];
    renderCard(state.card);
    loadHeader();
  });
}

function renderCard(c) {
  var p = c.prompt;
  $("cardBox").style.display = "block";
  $("reviewEmpty").style.display = "none";
  $("cardType").textContent = typeName(p.kind);
  $("cardType").className = "tag " + p.kind;
  $("cardTier").textContent = "提示·" + tierName(c.difficulty);
  $("cardTier").className = "tag tier-" + c.difficulty;
  $("cardSource").textContent = p.kind === "word" ? "" : "源自 " + p.extra.source;
  // render the cloze blanks with an underline
  $("cardPrompt").innerHTML = esc(p.question).replace(/____/g, '<span class="blank">____</span>');
  $("cardHint").textContent = p.hint || "";
  $("answerWord").textContent = p.answer;
  $("answerPhon").textContent = (p.extra && p.extra.phonetic) ? " " + p.extra.phonetic : "";
  var meta = [];
  if (p.extra && p.extra.pos) meta.push(p.extra.pos);
  if (p.extra && p.extra.senses_zh && p.extra.senses_zh.length) meta.push(p.extra.senses_zh.join("；"));
  if (p.extra && p.extra.example) meta.push("例：" + p.extra.example + "\n" + (p.extra.example_zh || ""));
  $("answerMeta").textContent = meta.join("\n");
  $("answerBox").classList.remove("show");
  $("btnReveal").style.display = "block";
  $("gradeRow").style.display = "none";
}

$("btnReveal").addEventListener("click", function () {
  $("answerBox").classList.add("show");
  $("btnReveal").style.display = "none";
  $("gradeRow").style.display = "flex";
});
document.querySelectorAll("#gradeRow .btn").forEach(function (b) {
  b.addEventListener("click", function () {
    if (!state.card) return;
    var id = state.card.id;
    api("/api/grade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, grade: +b.dataset.g })
    }).then(function () { nextCard(); });
  });
});

/* ---- phrase bank ---- */
function phraseRow(p) {
  var d = document.createElement("div");
  d.className = "row-item";
  var added = false;
  d.innerHTML =
    '<div class="hw">' + esc(p.text) + ' <span class="tag ' + (p.phrase_type === "pv" ? "phrase" : "pattern") + '">' +
    (p.phrase_type === "pv" ? "词组" : p.phrase_type === "id" ? "习语" : "句型") + "</span></div>" +
    (p.def_zh ? '<div class="sub">' + esc(p.def_zh) + "</div>" : "") +
    (p.def_en && !p.def_zh ? '<div class="sub">' + esc(p.def_en) + "</div>" : "") +
    (p.example_zh ? '<div class="sub">例：' + esc(p.example_zh) + "</div>" : "") +
    '<div class="actions"><button class="ghost addPhrase">🧩 加入学习</button></div>';
  d.querySelector(".addPhrase").addEventListener("click", function () {
    if (added) return;
    api("/api/phrase/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: p.source, text: p.text, type: p.phrase_type === "pv" ? "phrase" : "pattern" })
    }).then(function (r) {
      added = true;
      d.querySelector(".addPhrase").textContent = "✓ 已加入";
      toast(r.ok ? "已加入复习计划" : (r.error || "添加失败"));
    });
  });
  return d;
}

function loadBank(offset) {
  api("/api/phrases?limit=30&offset=" + offset).then(function (rows) {
    if (offset === 0) $("bankList").innerHTML = "";
    if (!rows.length) {
      if (offset === 0) {
        $("bankList").innerHTML = '<div class="empty">词组库为空<br><small>到「更多」里点「重建词组库」从词典提取</small></div>';
      }
      $("bankMore").style.display = "none";
      return;
    }
    $("bankMore").style.display = "block";
    rows.forEach(function (p) { $("bankList").appendChild(phraseRow(p)); });
    state.bankOffset = offset + rows.length;
    state.bankLoaded = true;
  });
}
$("bankMore").addEventListener("click", function () { loadBank(state.bankOffset); });

$("phraseGo").addEventListener("click", function () {
  var w = $("phraseSearch").value.trim();
  if (!w) return;
  api("/api/phrases/for?word=" + encodeURIComponent(w)).then(function (rows) {
    $("phraseResults").innerHTML = "";
    if (!rows.length) {
      $("phraseResults").innerHTML = '<div class="empty">词典里没有 "' + esc(w) + '" 的词组</div>';
      return;
    }
    rows.forEach(function (p) {
      p.source = w;
      $("phraseResults").appendChild(phraseRow(p));
    });
  });
});
$("phraseSearch").addEventListener("keydown", function (e) { if (e.key === "Enter") $("phraseGo").click(); });

$("btnRebuild").addEventListener("click", function () {
  this.disabled = true;
  toast("正在从词典提取词组，请稍候…");
  api("/api/phrases/rebuild", { method: "POST" }).then(function (r) {
    $("btnRebuild").disabled = false;
    toast("提取完成：" + r.count + " 条词组");
    state.bankLoaded = false;
    loadBank(0);
  });
});

/* ---- lookup ---- */
function doSearch() {
  var q = $("searchInput").value.trim();
  if (!q) return;
  api("/api/search?q=" + encodeURIComponent(q)).then(function (rows) {
    $("searchResults").innerHTML = "";
    if (!rows.length) {
      $("searchResults").innerHTML = '<div class="empty">没有找到 "' + esc(q) + '"</div>';
      return;
    }
    rows.forEach(function (r) {
      var d = document.createElement("div");
      d.className = "row-item click";
      d.innerHTML = '<div class="hw">' + esc(r.headword) + '</div><div class="sub">' +
        esc((r.text || "").split("\n").slice(0, 2).join(" · ").slice(0, 80)) + "</div>";
      d.addEventListener("click", function () { showEntry(r.headword); });
      $("searchResults").appendChild(d);
    });
  });
}
$("searchGo").addEventListener("click", doSearch);
$("searchInput").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });

$("btnRandom").addEventListener("click", function () {
  api("/api/random", { method: "POST" }).then(function (r) {
    if (r.ok) { toast("已加入：" + r.word); showEntry(r.word); }
    else toast("随机抽词失败");
  });
});

function showEntry(word) {
  api("/api/lookup?w=" + encodeURIComponent(word)).then(function (r) {
    $("dialogTitle").textContent = word;
    $("dialogBody").textContent = r.text || "（词典里没有这个词条）";
    $("dialogBg").classList.add("show");
    // rebind add button
    var btn = document.createElement("button");
    btn.className = "ghost";
    btn.style.marginTop = "12px";
    btn.textContent = "➕ 加入复习";
    btn.addEventListener("click", function () {
      api("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: word })
      }).then(function (x) {
        toast(x.ok ? "已加入复习计划" : (x.error || "添加失败"));
        $("dialogBg").classList.remove("show");
      });
    });
    $("dialogBody").appendChild(document.createElement("br"));
    $("dialogBody").appendChild(btn);
  });
}
$("dialogClose").addEventListener("click", function () { $("dialogBg").classList.remove("show"); });
$("dialogBg").addEventListener("click", function (e) {
  if (e.target === this) this.classList.remove("show");
});

/* ---- more: stats + records ---- */
function loadMore() {
  api("/api/stats").then(function (s) {
    $("statCells").innerHTML =
      '<div class="stat-cell"><div class="n">' + s.words + '</div><div class="t">词条</div></div>' +
      '<div class="stat-cell"><div class="n">' + s.cards + '</div><div class="t">卡片</div></div>' +
      '<div class="stat-cell"><div class="n">' + s.due + '</div><div class="t">今日到期</div></div>';
  });
  api("/api/cards?limit=50").then(function (rows) {
    var el = $("recordList");
    el.innerHTML = "";
    if (!rows.length) {
      el.innerHTML = '<div class="empty">还没有学习记录</div>';
      return;
    }
    rows.forEach(function (r) {
      var d = document.createElement("div");
      d.className = "row-item";
      d.innerHTML =
        '<div class="top" style="display:flex;gap:8px;align-items:center">' +
        '<div class="hw" style="flex:1">' + esc(r.headword) + '</div>' +
        '<span class="tag ' + r.card_type + '">' + typeName(r.card_type) + "</span>" +
        '<span class="tag tier-' + r.difficulty + '">' + tierName(r.difficulty) + "</span></div>" +
        '<div class="sub">复习 ' + r.reps + " 次 · 忘记 " + r.lapses + " 次 · 状态 " +
        ({ New: "新卡", Learning: "学习中", Review: "复习中", Relearning: "重学中" }[r.status] || r.status) +
        (r.due ? " · 到期 " + r.due : "") + "</div>" +
        '<div class="actions"><button class="ghost tE">简单提示</button>' +
        '<button class="ghost tM">中等提示</button><button class="ghost tH">困难提示</button></div>';
      d.querySelector(".tE").addEventListener("click", function () { setDiff(r.id, "easy"); });
      d.querySelector(".tM").addEventListener("click", function () { setDiff(r.id, "medium"); });
      d.querySelector(".tH").addEventListener("click", function () { setDiff(r.id, "hard"); });
      el.appendChild(d);
    });
  });
}
function setDiff(id, diff) {
  api("/api/card/difficulty", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, difficulty: diff })
  }).then(function () { toast("已调整提示难度"); loadMore(); });
}

/* ---- boot ---- */
loadHeader();
nextCard();
if ("serviceWorker" in navigator && location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost") {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
</script>
